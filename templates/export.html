<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIDAA – Konversationsexport</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --border: #e5e7eb; --text: #1f2937; --muted: #6b7280; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; }
  .step { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 0.75rem; }
  .step-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .step-badge { font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.6rem; border-radius: 9999px; color: #fff; }
  .step-time { color: var(--muted); font-size: 0.75rem; margin-left: auto; }
  .step-body { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; }
  .feedback { margin-top: 0.5rem; padding: 0.4rem 0.75rem; border-radius: 0.375rem; font-size: 0.8rem; }
  .feedback.up { background: #d1fae5; color: #065f46; }
  .feedback.down { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<h1>FIDAA – Konversationsexport</h1>
<p class="meta">Exportiert am {{exported_at}} &middot; {{step_count}} Schritte &middot; Thread: <code>{{thread_id}}</code></p>
{{#steps}}
<div class="step">
  <div class="step-header">
    <span class="step-badge" style="background:{{color}}">{{display_name}}</span>
    <span class="step-time">{{time}}</span>
  </div>
  <div class="step-body">{{content}}</div>
  {{#has_feedback}}
  <div class="feedback {{feedback_class}}">{{feedback_icon}} {{feedback_comment}}</div>
  {{/has_feedback}}
</div>
{{/steps}}
</body>
</html>
